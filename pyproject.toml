[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmove"
version = "0.1.0"
description = "Decode imagined left versus right hand movement from prerecorded EEG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "mne",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "streamlit",
    "pandas",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
